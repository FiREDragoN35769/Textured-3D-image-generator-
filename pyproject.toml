[project]
name = "textured-3d-image-generator"
version = "1.0.0"
description = "Textured 3D Image Generator — create images from text/reference, generate textured 3D geometry, preview in Three.js, export GLB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx[socks]==0.28.1",
    "python-multipart==0.0.22",
    "watchfiles==1.1.1",
    "google-genai>=2.22.0",
    "pillow>=12.3.0",
    "trimesh>=5.1.0",
    "numpy>=2.5.3",
    "sqlalchemy>=2.0.52",
    "psycopg2-binary>=2.9.12",
    "python-dotenv==1.2.1",
    "networkx==3.6.1",
]

[tool.uv]
exclude-newer = "14 days"
# workshop-connect is published by us; exempt from the rolling window.
exclude-newer-package = { workshop-connect = "2027-01-01" }
